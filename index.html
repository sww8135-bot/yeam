<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ช่วยในการเรียน | Student Study Planner</title>
  <meta name="description" content="เว็บแอปช่วยจัดการตารางเรียน การบ้าน กำหนดการสอบ และแผนอ่านหนังสือ ข้อมูลถูกเก็บในเบราว์เซอร์ของคุณ">
  <meta name="theme-color" content="#6366f1">

  <!-- Favicon & App Icon -->
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- ตั้งค่าโหมดมืด/สว่างก่อนวาดหน้า เพื่อไม่ให้หน้าจอวูบ -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('studyPlanner.v1') || '{}');
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="appHeader"></header>

  <main class="max-w-6xl mx-auto px-4 pt-5 pb-8">
    <section id="banner" aria-label="ภาพรวม"></section>
    <section id="view" class="mt-6" aria-live="polite"></section>
  </main>

  <nav id="bottomNav" class="md:hidden" aria-label="เมนูหลัก (มือถือ)"></nav>

  <dialog id="modal" aria-modal="true"></dialog>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
